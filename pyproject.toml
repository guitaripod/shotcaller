[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shotcaller"
version = "0.2.0"
description = "An LLM game master for Bot Warfare bots on IW4x servers: sets intent, never aim or movement."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shotcaller = "shotcaller.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shotcaller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

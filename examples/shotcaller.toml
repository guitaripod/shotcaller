[server]
game_dir = "/path/to/iw4x/game"
rcon_host = "127.0.0.1"
rcon_port = 28960

[llm]
base_url = "http://127.0.0.1:8081/v1"
model = "your-model-id"
temperature = 0.7
structured_output = true

[llm.timeouts_s]
match = 30.0
squad = 25.0

[maps]
rotation = ["mp_rust", "mp_terminal", "mp_highrise", "mp_favela", "mp_afghan", "mp_nuked"]

[limits]
max_skill_step = 2

[fairness]
death_delay_ms = 6000
death_max_age_ms = 300000

[cadence]
squad_s = 15.0
match_s = 120.0
orders_ttl_s = 45.0

[watchdog]
unit = "iw4x-server"
interval_s = 20.0
failures = 3
stale_s = 90.0
grace_s = 120.0
cooldown_s = 300.0

[gating]
reports_dir = "~/.local/share/shotcaller/reports"
trust_unvalidated = false

[gating.thresholds]
match = 0.9
squad = 0.92

[journal]
path = "~/.local/share/shotcaller/journal.jsonl"
max_mb = 64
backups = 3
